<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}" />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="{{CANONICAL}}" />
<meta name="color-scheme" content="light dark" />
<!-- Un repère indépendant de la bannière de cookies qu'on n'a pas : le site ne
     dépose rien, ne mesure rien, et le dit au navigateur plutôt qu'au visiteur. -->
<meta name="referrer" content="strict-origin-when-cross-origin" />
<!-- Les pages doivent être revalidées à chaque visite. L'hébergement ne pose
     aucune directive de cache sur le HTML : le navigateur applique alors sa
     propre heuristique et peut resservir pendant des heures une page d'avant
     la mise à jour — avec, par exemple, un bouton dont le script ne connaît
     plus le nom. Les ressources, elles, portent leur empreinte : elles
     peuvent rester en cache aussi longtemps que l'hébergeur le souhaite. Le
     fichier d'en-têtes ({{BASE}}../_headers ou .htaccess) pose la même règle
     côté serveur, pour l'hébergement qui en tient compte. -->
<meta http-equiv="Cache-Control" content="no-cache" />
<meta property="og:title" content="{{TITLE}}" />
<meta property="og:description" content="{{DESCRIPTION}}" />
<meta property="og:type" content="website" />
<meta property="og:url" content="{{CANONICAL}}" />
<meta property="og:site_name" content="{{SITE_NAME}}" />
<meta property="og:locale" content="{{OG_LOCALE}}" />
<meta property="og:image" content="{{OG_IMAGE}}" />
<meta property="og:image:width" content="{{OG_IMAGE_W}}" />
<meta property="og:image:height" content="{{OG_IMAGE_H}}" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{TITLE}}" />
<meta name="twitter:description" content="{{DESCRIPTION}}" />
<meta name="twitter:image" content="{{OG_IMAGE}}" />
<link rel="stylesheet" href="{{BASE}}assets/style.css?v={{V_CSS}}" />
<link rel="stylesheet" href="{{BASE}}assets/fete.css?v={{V_FETE_CSS}}" />
<!--
  La politique de contenu, posée dans la page.

  Ce site est statique : il n'y a pas de serveur d'application pour poser un
  en-tête, et l'hébergement qui le sert n'est pas toujours le nôtre. La balise
  fait l'essentiel du travail, en moins de choses — pas de « frame-ancestors »,
  que les navigateurs n'acceptent qu'en en-tête : _headers et .htaccess, à la
  racine du site généré, le portent pour l'hébergement qui les applique, avec
  les en-têtes qu'une balise ne peut pas poser (HSTS, X-Frame-Options,
  Permissions-Policy…). Là où l'on maîtrise le serveur, ces fichiers suffisent
  et la balise n'est qu'une redite ; ici, c'est mieux que rien, et « rien »
  était l'état précédent.

  Rien d'extérieur n'est chargé : ni police, ni mesure d'audience, ni script
  d'un tiers. La règle le dit au navigateur plutôt que de compter sur la bonne
  foi du code — et si quelqu'un en ajoutait un demain sans y penser, la page
  refuserait de le charger au lieu de l'accepter en silence.
-->
<meta http-equiv="Content-Security-Policy" content="{{CSP}}" />
<link rel="icon" href="{{BASE}}assets/favicon.svg?v={{V_ICON}}" type="image/svg+xml" />
<link rel="icon" href="{{BASE}}assets/favicon.ico?v={{V_ICON}}" sizes="16x16 32x32 48x48" />
<link rel="apple-touch-icon" href="{{BASE}}assets/apple-touch-icon.png?v={{V_ICON}}" />
<link rel="manifest" href="{{BASE}}manifest.webmanifest" />
<meta name="theme-color" content="#f4f6fc" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#080d20" media="(prefers-color-scheme: dark)" />
{{ALTERNATES}}
{{JSONLD}}
<script src="{{BASE}}assets/theme-boot.js?v={{V_BOOT}}"></script>
</head>
<body>
{{FETE}}
<a class="skip" href="#contenu">{{SKIP}}</a>
{{NAV}}
<main id="contenu">
{{CONTENT}}
</main>
{{FOOT}}
<script src="{{BASE}}assets/app.js?v={{V_APP}}" defer></script>
<script src="{{BASE}}assets/fete.js?v={{V_FETE_JS}}" defer></script>
</body>
</html>
