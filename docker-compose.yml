# =============================================================================
# Toutadmin — édition Node
# =============================================================================
#
#     docker compose up -d      puis ouvrir http://localhost:3000
#
# L'assistant d'installation s'y déroule en huit étapes et se ferme de lui-même
# une fois le compte d'administration créé. Rien à supprimer ensuite.
#
# Changer de version :
#
#     docker compose pull && docker compose up -d
#
# C'est le seul chemin : le code vit dans l'image et l'écran « Mises à jour »
# le dit en toutes lettres. Les données, elles, sont dans le volume et ne sont
# pas touchées par un remplacement d'image.
# -----------------------------------------------------------------------------

services:
  cms:
    image: toutadmin:1.0.0
    # Pour bâtir l'image depuis les sources plutôt que de la tirer :
    # build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Tout l'état d'exécution tient ici : la base, instance.json, le secret
      # de session, les photos de profil, le coffre-fort, les CV, le
      # parapheur, les pièces reçues, les sauvegardes. Un volume, et
      # l'instance reste la même après n'importe quel remplacement d'image —
      # y compris aux yeux du service de licences.
      - donnees:/donnees
    environment:
      # Sur un serveur exposé, l'assistant réclame ce jeton avant d'installer :
      # c'est ce qui empêche le premier venu de prendre l'instance pendant les
      # minutes qui séparent le démarrage de l'installation.
      #
      # INSTALL_TOKEN: un-jeton-long-et-aleatoire

      # La base : SQLite par défaut, dans le volume. Pour MySQL, décommenter
      # le service « base » plus bas et les cinq lignes qui suivent.
      #
      # DB_DRIVER: mysql
      # DB_HOST: base
      # DB_NAME: toutadmin
      # DB_USER: toutadmin
      # DB_PASSWORD: a-changer
      TZ: Europe/Paris
    # depends_on:
    #   base:
    #     condition: service_healthy

  # ── MySQL, si vous le préférez à SQLite ────────────────────────────────────
  #
  # Les deux moteurs portent le même schéma et passent la même suite de tests.
  # SQLite suffit largement en deçà de quelques dizaines de salariés ; la page
  # « SQLite ou MySQL » de la documentation dit lequel prendre.
  #
  # base:
  #   image: mariadb:11
  #   restart: unless-stopped
  #   environment:
  #     MARIADB_DATABASE: toutadmin
  #     MARIADB_USER: toutadmin
  #     MARIADB_PASSWORD: a-changer
  #     MARIADB_RANDOM_ROOT_PASSWORD: "yes"
  #   volumes:
  #     - base:/var/lib/mysql
  #   healthcheck:
  #     # « up » interroge le serveur ; sans cela, le CMS démarrerait pendant
  #     # que MariaDB initialise encore sa base et se croirait sans base.
  #     test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 12

volumes:
  donnees:
  # base:
