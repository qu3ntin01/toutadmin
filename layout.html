<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}" />
<meta name="color-scheme" content="light dark" />
<!-- Les pages doivent être revalidées à chaque visite. L'hébergement ne pose
     aucune directive de cache sur le HTML : le navigateur applique alors sa
     propre heuristique et peut resservir pendant des heures une page d'avant
     la mise à jour — avec, par exemple, un bouton dont le script ne connaît
     plus le nom. Les ressources, elles, portent leur empreinte : elles
     peuvent rester en cache aussi longtemps que l'hébergeur le souhaite. -->
<meta http-equiv="Cache-Control" content="no-cache" />
<meta property="og:title" content="{{TITLE}}" />
<meta property="og:description" content="{{DESCRIPTION}}" />
<meta property="og:type" content="website" />
<link rel="stylesheet" href="{{BASE}}assets/style.css?v={{V_CSS}}" />
<link rel="icon" href="{{BASE}}assets/favicon.svg" type="image/svg+xml" />
{{ALTERNATES}}
<script src="{{BASE}}assets/theme-boot.js?v={{V_BOOT}}"></script>
</head>
<body>
<a class="skip" href="#contenu">{{SKIP}}</a>
{{NAV}}
<main id="contenu">
{{CONTENT}}
</main>
{{FOOT}}
<script src="{{BASE}}assets/app.js?v={{V_APP}}" defer></script>
</body>
</html>
