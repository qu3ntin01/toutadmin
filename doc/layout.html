<!doctype html>
<html lang="fr" data-base="{{BASE}}">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="description" content="{{DESCRIPTION}}" />
<title>{{TITLE}} — Documentation Salarié Member</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%230b46d1'/><text x='16' y='22' font-family='system-ui,sans-serif' font-size='15' font-weight='700' fill='%23fff' text-anchor='middle'>SM</text></svg>" />
<link rel="stylesheet" href="{{BASE}}assets/style.css" />
<script>
/* Le thème choisi est appliqué avant le premier rendu : sans cela, une page
   sombre s'ouvrirait en blanc le temps du chargement. */
(function () {
  try {
    var stored = localStorage.getItem('doc-theme');
    if (stored === 'dark' || stored === 'light') {
      document.documentElement.setAttribute('data-theme', stored);
    }
  } catch (e) { /* stockage indisponible : on suit le système */ }
})();
</script>
</head>
<body>

<header class="top">
  <button class="icon-btn nav-toggle" type="button" aria-label="Ouvrir la navigation" aria-expanded="false">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
  </button>

  <a class="brand" href="{{BASE}}index.html">
    <span class="brand-mark">SM</span>
    <span>Salarié Member<small>Documentation</small></span>
  </a>

  <span class="top-spacer"></span>

  <div class="top-search">
    <input type="search" placeholder="Rechercher…  (touche /)" aria-label="Rechercher dans la documentation" autocomplete="off" />
    <div class="results" hidden></div>
  </div>

  <button class="icon-btn" type="button" data-theme-toggle aria-label="Basculer le thème clair ou sombre">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" /></svg>
  </button>
</header>

<div class="shell">
  <nav class="side" aria-label="Sommaire du site">
{{SIDEBAR}}
  </nav>

  <main>
    <article class="prose{{WIDE}}">
{{CONTENT}}
{{PAGER}}
      <p class="foot">Documentation de Salarié Member — construite le {{DATE}}. Site autonome, indépendant du logiciel.</p>
    </article>
  </main>

  <aside class="toc" aria-label="Sur cette page">
{{TOC}}

</div>

<script src="{{BASE}}assets/doc.js"></script>
